name: Publish NuGet packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      package-version:
        description: NuGet package version to publish
        required: true
        type: string

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diag-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix diag-web

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          else {
            '${{ inputs.package-version }}'
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Package version '$version' must be valid SemVer, such as 5.0.1 or 5.1.0-preview.1."
          }

          "package-version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release packages
        shell: pwsh
        run: ./Build.ps1 -PackageVersion '${{ steps.version.outputs.package-version }}'

      # This exchanges GitHub's OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: cell001uk

      - name: Publish packages
        shell: bash
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg'
          --api-key '${{ steps.login.outputs.NUGET_API_KEY }}'
          --source 'https://api.nuget.org/v3/index.json'
          --skip-duplicate
          --timeout 300
